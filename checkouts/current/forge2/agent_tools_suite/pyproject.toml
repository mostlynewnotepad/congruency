# Installable package for the forge2 rewrite of the forge repo `agent_tools_suite`
# (#200 req 3: a proper package — pyproject.toml, `pip install -e .` works, console
# entry points where applicable). GENERATED by congruency/tools/forge_package.py (#410):
# it is a pure function of the modules present, so adding a module regenerates this file as
# a SUPERSET and never clobbers a sibling. Do not hand-edit — a rewrite unit writes ONLY its
# own `agent_tools_suite/<module>.py`; this scaffolding is derived.
#
# This directory IS the import package, so `package-dir` maps `agent_tools_suite` onto '.'; setuptools
# then includes EVERY .py here as a submodule, so imports need no per-module enumeration and
# `from agent_tools_suite.<module> import <name>` resolves for every module that lands.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge2-agent-tools-suite"
version = "1.0.0"
description = "forge2 rewrite of the forge repo agent_tools_suite — behavior-preserving, installable, control-config'd Python (refactor standard #200)"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
forge2-ats-http = "agent_tools_suite.ats_http:main"
forge2-ats-service = "agent_tools_suite.ats_service:main"
forge2-audit-guard = "agent_tools_suite.audit_guard:main"
forge2-coupler = "agent_tools_suite.coupler:main"
forge2-crank-approve = "agent_tools_suite.crank_approve:main"
forge2-crank-discipline = "agent_tools_suite.crank_discipline:main"
forge2-crank-job = "agent_tools_suite.crank_job:main"
forge2-test-crank-discipline = "agent_tools_suite.test_crank_discipline:main"

[tool.setuptools]
packages = ["agent_tools_suite"]

[tool.setuptools.package-dir]
agent_tools_suite = "."

# The config registry ships WITH the package so a non-editable install can still see its
# config object by walking up from the installed module.
[tool.setuptools.package-data]
agent_tools_suite = ["registry.json"]
