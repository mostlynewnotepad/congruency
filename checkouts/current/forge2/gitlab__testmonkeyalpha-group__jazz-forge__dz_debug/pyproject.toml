# Installable package for the forge2 rewrite of the forge repo `gitlab__testmonkeyalpha-group__jazz-forge__dz_debug`
# (#200 req 3: a proper package — pyproject.toml, `pip install -e .` works, console
# entry points where applicable). GENERATED by congruency/tools/forge_package.py (#410):
# it is a pure function of the modules present, so adding a module regenerates this file as
# a SUPERSET and never clobbers a sibling. Do not hand-edit — a rewrite unit writes ONLY its
# own `gitlab__testmonkeyalpha_group__jazz_forge__dz_debug/<module>.py`; this scaffolding is derived.
#
# This directory IS the import package, so `package-dir` maps `gitlab__testmonkeyalpha_group__jazz_forge__dz_debug` onto '.'; setuptools
# then includes EVERY .py here as a submodule, so imports need no per-module enumeration and
# `from gitlab__testmonkeyalpha_group__jazz_forge__dz_debug.<module> import <name>` resolves for every module that lands.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge2-gitlab-testmonkeyalpha-group-jazz-forge-dz-debug"
version = "1.0.0"
description = "forge2 rewrite of the forge repo gitlab__testmonkeyalpha-group__jazz-forge__dz_debug — behavior-preserving, installable, control-config'd Python (refactor standard #200)"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
packages = ["gitlab__testmonkeyalpha_group__jazz_forge__dz_debug"]

[tool.setuptools.package-dir]
gitlab__testmonkeyalpha_group__jazz_forge__dz_debug = "."

# The config registry ships WITH the package so a non-editable install can still see its
# config object by walking up from the installed module.
[tool.setuptools.package-data]
gitlab__testmonkeyalpha_group__jazz_forge__dz_debug = ["registry.json"]
