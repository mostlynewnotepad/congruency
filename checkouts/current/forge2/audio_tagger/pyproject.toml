# Installable package for the forge2 rewrite of the forge repo `audio_tagger`
# (#200 req 3: a proper package — pyproject.toml, `pip install -e .` works, console
# entry points where applicable). GENERATED by congruency/tools/forge_package.py (#410):
# it is a pure function of the modules present, so adding a module regenerates this file as
# a SUPERSET and never clobbers a sibling. Do not hand-edit — a rewrite unit writes ONLY its
# own `audio_tagger/<module>.py`; this scaffolding is derived.
#
# This directory IS the import package, so `package-dir` maps `audio_tagger` onto '.'; setuptools
# then includes EVERY .py here as a submodule, so imports need no per-module enumeration and
# `from audio_tagger.<module> import <name>` resolves for every module that lands.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge2-audio-tagger"
version = "1.0.0"
description = "forge2 rewrite of the forge repo audio_tagger — behavior-preserving, installable, control-config'd Python (refactor standard #200)"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
packages = ["audio_tagger"]

[tool.setuptools.package-dir]
audio_tagger = "."

# The config registry ships WITH the package so a non-editable install can still see its
# config object by walking up from the installed module.
[tool.setuptools.package-data]
audio_tagger = ["registry.json"]
