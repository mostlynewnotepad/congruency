# Installable package for the forge2 rewrite of the forge repo `artifact_tree_gen`
# (#200 req 3: a proper package — pyproject.toml, `pip install -e .` works, console
# entry points where applicable). GENERATED by congruency/tools/forge_package.py (#410):
# it is a pure function of the modules present, so adding a module regenerates this file as
# a SUPERSET and never clobbers a sibling. Do not hand-edit — a rewrite unit writes ONLY its
# own `artifact_tree_gen/<module>.py`; this scaffolding is derived.
#
# This directory IS the import package, so `package-dir` maps `artifact_tree_gen` onto '.'; setuptools
# then includes EVERY .py here as a submodule, so imports need no per-module enumeration and
# `from artifact_tree_gen.<module> import <name>` resolves for every module that lands.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge2-artifact-tree-gen"
version = "1.0.0"
description = "forge2 rewrite of the forge repo artifact_tree_gen — behavior-preserving, installable, control-config'd Python (refactor standard #200)"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
forge2-add = "artifact_tree_gen.add:main"
forge2-clamp = "artifact_tree_gen.clamp:main"
forge2-fib = "artifact_tree_gen.fib:main"

[tool.setuptools]
packages = ["artifact_tree_gen"]

[tool.setuptools.package-dir]
artifact_tree_gen = "."

# The config registry ships WITH the package so a non-editable install can still see its
# config object by walking up from the installed module.
[tool.setuptools.package-data]
artifact_tree_gen = ["registry.json"]
